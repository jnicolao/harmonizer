services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: harmonizer
      POSTGRES_PASSWORD: harmonizer
      POSTGRES_DB: harmonizer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmonizer -d harmonizer"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
